# Example: Creating an image pull secret for GHCR
#
# If your GHCR package is private, you need to create an image pull secret
# in the crossplane-system namespace so Crossplane can pull the package.
#
# This file provides an example. DO NOT commit this file with real credentials.
#
# To create the secret using kubectl (recommended):
#
#   kubectl create secret docker-registry ghcr-credentials \
#     --namespace crossplane-system \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GITHUB_USERNAME \
#     --docker-password=YOUR_GITHUB_TOKEN \
#     --docker-email=your-email@example.com
#
# Then reference it in your Provider resource:
#
#   apiVersion: pkg.crossplane.io/v1
#   kind: Provider
#   metadata:
#     name: provider-sql
#   spec:
#     package: ghcr.io/kyosenergy-engineering/provider-sql:latest
#     packagePullSecrets:
#       - name: ghcr-credentials

---
# Alternative: Create via YAML (remember to base64 encode your credentials)
# To generate the base64 encoded auth string:
#
#   echo -n 'YOUR_GITHUB_USERNAME:YOUR_GITHUB_TOKEN' | base64
#
# Then use it in the .dockerconfigjson field below

# apiVersion: v1
# kind: Secret
# metadata:
#   name: ghcr-credentials
#   namespace: crossplane-system
# type: kubernetes.io/dockerconfigjson
# data:
#   .dockerconfigjson: BASE64_ENCODED_DOCKER_CONFIG
