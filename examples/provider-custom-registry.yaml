# Example: Installing provider-sql from a custom registry (e.g., GHCR)
# 
# This example shows how to install the provider from GitHub Container Registry
# or any other custom registry after publishing it following the guide in
# PUBLISHING_TO_GHCR.md
#
# Usage:
# 1. Replace REGISTRY_URL and VERSION with your actual values
# 2. Apply this file: kubectl apply -f examples/provider-custom-registry.yaml
# 3. Verify installation: kubectl get providers

apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-sql
spec:
  # Replace this with your published package location
  # Examples:
  #   ghcr.io/kyosenergy-engineering/provider-sql:v0.9.0
  #   ghcr.io/your-org/provider-sql:latest
  #   your-registry.com/your-org/provider-sql:v1.0.0
  package: ghcr.io/kyosenergy-engineering/provider-sql:latest
  
  # Optional: Configure package pull policy
  # packagePullPolicy: IfNotPresent  # or Always
  
  # Optional: Reference image pull secrets if your registry requires authentication
  # and the credentials are not already configured in the cluster
  # packagePullSecrets:
  #   - name: ghcr-credentials
